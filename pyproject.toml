[project]
name = "nextbike-prediction"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Janick Sturm", email = "sturmjanick@gmx.net" }
]
requires-python = ">=3.13"
dependencies = [
    "duckdb>=1.5.5",
    "fastapi>=0.141.1",
    "fastparquet>=2026.5.0",
    "pandas>=3.0.5",
    "pyarrow>=25.0.1",
    "requests>=2.34.2",
    "uvicorn[standard]>=0.52.1",
]

[project.scripts]
nextbike-prediction = "nextbike_prediction:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
