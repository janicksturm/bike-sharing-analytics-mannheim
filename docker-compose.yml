services:
  postgres:
    image: postgres:17
    container_name: nextbike-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: nextbike
      POSTGRES_USER: nextbike
      POSTGRES_PASSWORD: nextbike

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nextbike -d nextbike"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: nextbike-api
    environment:
      DATABASE_URL: postgresql+psycopg://nextbike:nextbike@postgres:5432/nextbike
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    command: ["uv", "run", "uvicorn", "src.nextbike_prediction.api.app:app", "--host", "0.0.0.0", "--port", "8000"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

  pipeline:
    build: .
    container_name: nextbike-pipeline
    environment:
      DATABASE_URL: postgresql+psycopg://nextbike:nextbike@postgres:5432/nextbike
    volumes:
      - ./data:/app/data
    command: ["uv", "run", "python", "main.py"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

  dashboard:
    build: ./dashboard
    container_name: nextbike-dashboard
    ports:
      - "3000:80"
    restart: unless-stopped

volumes:
  postgres_data: